version: '3.2'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    expose:
      - 9090
    restart: always
    env_file: .env
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    # move basic auth to top level proxy or use caddy/trafik
    #- --web.config.file=/tmp/web.yml
    volumes:
    - ./prometheus/:/etc/prometheus/:ro
    - prometheusdata:/prometheus
    networks:
      - monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    expose:
      - 8080
    restart: always
    volumes:
    - /:/rootfs:ro,rslave
    - /var/run:/var/run:ro
    - /sys:/sys:ro
    - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring

  docker-exporter:
    image: rebel028/docker_exporter
    #image: prom/container-exporter 
    container_name: docker_exporter
    restart: always
    volumes:
    - "${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro"
    expose:
      - 9417
    environment:
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
  
  node-exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: node-exporter
    command:
      - '--path.rootfs=/host'
    pid: host
    restart: always
    expose:
      - 9100
    volumes:
      - '/:/host:ro,rslave'
    networks:
      - monitoring

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.81.0
    container_name: otel-collector
    restart: always
    env_file: .env
    command: [ "--config=/etc/collector.yaml" ]
    volumes:
      - ./otel/otel-collector-config.yml:/etc/collector.yaml
    networks:
      - monitoring
  
  # postgres-exporter:
  #   container_name: postgres-exporter
  #   image: quay.io/prometheuscommunity/postgres-exporter
  #   environment:
  #       - DATA_SOURCE_URI=db:5432/postgres?sslmode=disable
  #       - DATA_SOURCE_USER=postgres_exporter
  #       - DATA_SOURCE_PASS=
  #   # networks:
  #   #   - postgres_net

networks:
  monitoring:
    name: monitoring

volumes:
  prometheusdata:
